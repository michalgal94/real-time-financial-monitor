services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["distributed-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
  backend:
    build: .
    image: financial-monitor:distributed
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Storage__Provider: Redis
      ConnectionStrings__Redis: redis:6379
      Redis__KeyPrefix: ledger-distributed
      Transactions__Capacity: "1000"
    depends_on:
      redis:
        condition: service_healthy
  proxy:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [backend]
volumes:
  distributed-redis:
